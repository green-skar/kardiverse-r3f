services:
  - type: web
    name: kardiverse-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn kardiverse_backend.wsgi:application
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: kardiverse-backend.onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://kardiverse-frontend-83up.onrender.com,http://localhost:3000,http://localhost:5173

  - type: static
    name: kardiverse-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://kardiverse-backend.onrender.com
      - key: VITE_QR_URL
        value: https://kardiverse-frontend-83up.onrender.com/qr-scan
    routes:
      - type: rewrite
        source: /*
        destination: /index.html