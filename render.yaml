# Render Blueprint Configuration
# This file defines the deployment configuration for both backend and frontend services
# Do not use Dockerfile - this Blueprint handles the deployment
services:
  # Django Backend Service
  - type: web
    name: kardiverse-backend
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: gunicorn kardiverse_backend.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "kardiverse-r3f-1.onrender.com,kardiverse-backend.onrender.com,localhost,127.0.0.1,*.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://kardiverse-frontend.onrender.com,http://localhost:5173,http://localhost:3000"
      - key: AI_TTS_API_KEY
        sync: false
      - key: MUX_TOKEN_ID
        sync: false
      - key: MUX_TOKEN_SECRET
        sync: false

  # React Frontend Service
  - type: web
    name: kardiverse-frontend
    env: static
    plan: starter
    buildCommand: npm ci --legacy-peer-deps && npm run build
    staticPublishPath: ./dist
    # Client-side routing configuration for React SPA
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://kardiverse-backend.onrender.com"
      - key: VITE_MUX_TOKEN_ID
        sync: false
      - key: VITE_MUX_TOKEN_SECRET
        sync: false
