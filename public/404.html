<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Loading...</title>
    <script>
        // This is a fallback - the _redirects file should handle most cases
        // If we reach here, redirect to index.html while preserving the path
        const currentPath = window.location.pathname;
        const currentSearch = window.location.search;
        const currentHash = window.location.hash;
        
        // Only redirect if we're not already on index.html
        if (!currentPath.includes('index.html')) {
            window.location.replace('/index.html' + currentPath + currentSearch + currentHash);
        }
    </script>
</head>
<body>
    <p>Loading...</p>
</body>
</html>
